# ecsim.toml — configuration for `uv run shadow-sim.py`.
#
# Describes a single Shadow simulation: how many nodes, how they are wired over
# QUIC, and a geo-realistic network (per-host region, supernode class + EIP-7870
# bandwidth, inter-region latency matrix + jitter).

[run]
# "docker" builds an image (ec-sim on top of [docker].shadow_image) and runs Shadow
#          in a container — zero local setup beyond Docker.
# "native" builds ec-sim with `cargo build --release` and runs a `shadow` binary
#          found on PATH — requires Shadow installed locally (Linux).
runner = "docker"

[sim]
mode = "gossipsub-rs"           # gossipsub | gossipsub-chunked | gossipsub-rs | rs-partial | rs-subnets | chunk-subnets | hybrid | rlnc
title = "gossipsub-rs-256kb" # label shown in summary.html
seed = 42                     # master RNG seed (topology + per-node keypairs)
runs = 1                      # number of runs; run i uses seed+i
payload_size_kib = 256        # payload the builder publishes once after warmup
warmup_secs = 15              # extra wait after connections/mesh are ready
observe_secs = 20             # window after publish before every node exits
# rs-partial tuned profile (128 nodes, seed 42): 3 recipients/shard; mesh
# 60/80/90 with 18 outbound peers. Validated at 128/128 reconstructed, t95=856 ms.
payload_chunk_recipients = 3  # rs-partial: mesh peers seeded per shard
gossipsub_chunk_count = 64    # gossipsub-chunked / chunk-subnets: raw payload chunks
chunked_send_idontwant = false # gossipsub-chunked / chunk-subnets: notify mesh peers after each accepted chunk
chunked_gossip_lazy = 0       # gossipsub-chunked: D_lazy (other modes use gossip_lazy)
# gossipsub-rs: RS rate for the single shard topic. Any `data_shards` of
# `total_shards` reconstruct, so total/data is the bandwidth multiplier:
# 64-of-128 doubles the bytes on the wire, 64-of-80 costs only 1.25x.
# Reed-Solomon over GF(2^8) caps total_shards at 256.
gossipsub_rs_data_shards = 64
gossipsub_rs_total_shards = 128
rlnc_chunks = 15              # RLNC source-packet count N
rlnc_fanout = 18              # RLNC push degree D (independent of gossipsub meshes)
# hybrid: every node receives full payload gossip; selected nodes also receive
# all RS column subnets and re-gossip a chunk-reconstructed payload. "fraction"
# selects a seeded random subset (including the builder); "supernodes" selects
# all supernodes plus the builder. The selection must include at least 2 nodes.
hybrid_selection = "supernodes" # fraction | supernodes
hybrid_rs_subnet_fraction = 0.25

# Gossipsub fan-out. libp2p defaults flood_publish to true; Ethereum clients set
# false. Zero lazy gossip so amplification does not dominate the comparison.
flood_publish = false
gossip_lazy = 0
gossip_factor = 0.00

# Per-topic mesh sizing. Every profile must satisfy:
#   <profile>_mesh_outbound_min <= <profile>_mesh_n_low <= <profile>_mesh_n <= <profile>_mesh_n_high
#   and 2 * <profile>_mesh_outbound_min <= <profile>_mesh_n
# The execution, chunked, partial, and chunk-subnet topics are broadly
# subscribed; RS column subnets are subscribed only by hybrid nodes, so they use
# a smaller mesh.
execution_mesh_n_low = 4
execution_mesh_n = 8
execution_mesh_n_high = 12
execution_mesh_outbound_min = 3

chunked_mesh_n_low = 4
chunked_mesh_n = 8
chunked_mesh_n_high = 12
chunked_mesh_outbound_min = 3

partial_mesh_n_low = 60
partial_mesh_n = 80
partial_mesh_n_high = 90
partial_mesh_outbound_min = 18

subnet_mesh_n_low = 1
subnet_mesh_n = 3
subnet_mesh_n_high = 5
subnet_mesh_outbound_min = 1

# chunk-subnets needs *every* chunk, so it has no erasure slack: a mesh as sparse
# as the RS column subnets would strand nodes that miss a single chunk. Start
# from the chunked degrees instead.
chunk_subnet_mesh_n_low = 4
chunk_subnet_mesh_n = 8
chunk_subnet_mesh_n_high = 12
chunk_subnet_mesh_outbound_min = 3

# gossipsub-rs carries every shard on one broadly subscribed topic, so it uses
# execution-sized degrees rather than the sparse per-subnet ones.
gossipsub_rs_mesh_n_low = 4
gossipsub_rs_mesh_n = 8
gossipsub_rs_mesh_n_high = 12
gossipsub_rs_mesh_outbound_min = 3

rust_log = "info"
# stop_time = "90s"           # optional; default = warmup_secs + observe_secs + 60s

[topology]
nodes = 128                   # including the builder (node 0)
peers_per_node = 50           # random QUIC peers each node dials

# Geo-realistic network. A seeded fraction of hosts are supernodes with 1 Gbit
# both ways. Other hosts use EIP-7870 bandwidth (50 Mbit down / 25 Mbit up).
# Inter-host latency comes from a fixed inter-region matrix + per-edge jitter.
[network]
jitter_ratio = 0.3
packet_loss = 0.0
supernode_fraction = 0.05
supernode_bandwidth_up = "1 Gbit"
supernode_bandwidth_down = "1 Gbit"
non_supernode_bandwidth_up = "25 Mbit"
non_supernode_bandwidth_down = "50 Mbit"

[network.regions]             # region -> weight (probability a host lands there)
us-east = 0.30
us-west = 0.15
europe  = 0.25
asia    = 0.20
sa      = 0.05
africa  = 0.05

[docker]
# Base image that ships Shadow (arm64). The :tcpfix tag on Docker Hub carries
# the tcp_sendUserData 65535-byte send-cap fix used by blobsim.
shadow_image = "kamilsa/shadow-arm:tcpfix"
image_name = "ecsim-shadow:local"
rebuild = false

[output]
dir = "shadow-output"
